<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лента ответов | Образовательная платформа</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#fff7ed', 100: '#ffedd5', 200: '#fed7aa', 300: '#fdba74',
                            400: '#fb923c', 500: '#f97316', 600: '#ea580c', 700: '#c2410c',
                            800: '#9a3412', 900: '#7c2d12'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 font-sans">
    <div class="flex h-screen overflow-hidden">
        <div class="md:hidden fixed top-4 left-4 z-50">
            <button id="menuToggle" class="text-primary-500 focus:outline-none">
                <i class="fas fa-bars text-2xl"></i>
            </button>
        </div>

        <div id="overlay" class="overlay"></div>

        <aside id="sidebar" class="sidebar w-64 bg-white text-gray-800 flex-shrink-0 shadow-lg">
            <div class="p-4 border-b border-gray-200">
                <a href="index.html" class="text-2xl font-bold text-primary-500">EduPlatform</a>
            </div>
            <nav class="p-4">
                <ul class="space-y-2">
                    <li><a href="my-courses.html" class="nav-link flex items-center p-3 rounded-lg hover:bg-primary-50 text-gray-700 hover:text-primary-600 transition" data-page="my-courses"><i class="fas fa-book mr-3 text-primary-400"></i><span>Мои курсы</span></a></li>
                    <li><a href="answers-feed.html" class="nav-link flex items-center p-3 rounded-lg bg-primary-100 text-primary-600" data-page="answers-feed"><i class="fas fa-stream mr-3 text-primary-500"></i><span>Лента ответов</span></a></li>
                    <li><a href="testing.html" class="nav-link flex items-center p-3 rounded-lg hover:bg-primary-50 text-gray-700 hover:text-primary-600 transition" data-page="testing"><i class="fas fa-clipboard-check mr-3 text-primary-400"></i><span>Тестирование</span></a></li>
                    <li><a href="schedule.html" class="nav-link flex items-center p-3 rounded-lg hover:bg-primary-50 text-gray-700 hover:text-primary-600 transition" data-page="schedule"><i class="fas fa-calendar-alt mr-3 text-primary-400"></i><span>Расписание</span></a></li>
                    <li><a href="profile.html" class="nav-link flex items-center p-3 rounded-lg hover:bg-primary-50 text-gray-700 hover:text-primary-600 transition" data-page="profile"><i class="fas fa-user mr-3 text-primary-400"></i><span>Профиль</span></a></li>
                </ul>
            </nav>
        </aside>

        <main class="flex-1 overflow-auto">
            <header class="bg-white shadow-sm">
                <div class="px-4 py-4 flex justify-between items-center border-b border-gray-200">
                    <h1 class="text-xl font-semibold text-gray-800">Лента ответов</h1>
                    <div id="user-menu-placeholder"></div>
                </div>
            </header>

            <div class="p-4">
                <div class="bg-white rounded-lg shadow-sm p-4 mb-6">
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                        <div>
                            <label for="course-filter" class="block text-sm font-medium text-gray-700 mb-1">Курс</label>
                            <select id="course-filter" class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                                <option value="">Все курсы</option>
                            </select>
                        </div>
                        <div id="lesson-filter-container" class="hidden">
                            <label for="lesson-filter" class="block text-sm font-medium text-gray-700 mb-1">Урок</label>
                            <select id="lesson-filter" class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                                <option value="">Все уроки</option>
                            </select>
                        </div>
                        <div>
                            <label for="status-filter" class="block text-sm font-medium text-gray-700 mb-1">Статус</label>
                            <select id="status-filter" class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                                <option value="">Все статусы</option>
                                <option value="Требует проверки">Требует проверки</option>
                                <option value="Просмотрено">Просмотрено</option>
                                <option value="Принято">Принято</option>
                                <option value="На доработку">На доработку</option>
                            </select>
                        </div>
                        <div class="flex items-end">
                            <button id="reset-filters-btn" class="w-full bg-gray-100 hover:bg-gray-200 text-gray-800 font-medium py-2 px-4 rounded-md transition">
                                Сбросить фильтры
                            </button>
                        </div>
                    </div>
                </div>

                <div id="answers-feed-container" class="space-y-4">
                    <!-- Здесь будут загружаться карточки ответов -->
                </div>

                <div id="loader" class="hidden text-center py-8">
                    <div class="inline-block animate-spin rounded-full h-8 w-8 border-t-2 border-b-2 border-primary-500"></div>
                    <p class="mt-2 text-gray-600">Загрузка данных...</p>
                </div>
            </div>
        </main>
    </div>

    <script src="js/answers-feed.js"></script>
</body>
</html>
